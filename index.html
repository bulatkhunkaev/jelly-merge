<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jelly Merge</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0b0c14; outline: none; }
    /* экран загрузки: баннер Jelly Pop на весь экран (cover), под логотипом — индикатор */
    #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #000; transition: opacity .5s; z-index: 10;
      padding-top: var(--tg-top, 0px); box-sizing: border-box; }   /* не заезжаем под кнопки Telegram */
    #splash { position: relative; flex: none; aspect-ratio: 941 / 1672;
      width: max(100vw, calc((100vh - var(--tg-top, 0px)) * 941 / 1672)); height: auto;
      background: url('TemplateData/splash3.jpg') center / 100% 100% no-repeat; }
    #bar { position: absolute; left: 50%; transform: translateX(-50%); top: 36.6%;
      width: min(46%, 82vw); height: 12px; padding: 4px; box-sizing: content-box;
      border-radius: 99px; background: rgba(10, 6, 24, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 0 16px rgba(0,0,0,.5); }
    #fill { height: 100%; width: 0; border-radius: 99px; transition: width .12s linear;
      background: linear-gradient(90deg, #ff2d8e, #ff8a12, #ffcc14, #44e01c, #1e6eff, #a83aff);
      box-shadow: 0 0 10px rgba(255,120,200,.7); }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><div id="splash"><div id="bar"><div id="fill"></div></div></div></div>
  <script>
    // --- Telegram Mini App: на телефоне — полноэкранный режим (без шапки, кнопки Telegram поверх игры),
    //     без закрытия свайпом; игра получает высоту зоны кнопок и опускает интерфейс под них
    var tg = window.Telegram && window.Telegram.WebApp;
    var unityInst = null;
    function topInsetCss() {
      if (!tg) return 0;
      var a = tg.safeAreaInset || {}, c = tg.contentSafeAreaInset || {};
      return (a.top || 0) + (c.top || 0);
    }
    function pushInset() {
      document.documentElement.style.setProperty('--tg-top', topInsetCss() + 'px');
      if (!unityInst) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      try { unityInst.SendMessage('JellyGame', 'SetTopInset', String(topInsetCss() * dpr)); } catch (e) { }
    }
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        var mobile = ['ios', 'android', 'android_x'].indexOf(tg.platform) >= 0;
        if (mobile && tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) tg.requestFullscreen();
        if (tg.lockOrientation && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) tg.lockOrientation();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        if (tg.setBottomBarColor) tg.setBottomBarColor('#000000');
        tg.onEvent('safeAreaChanged', pushInset);
        tg.onEvent('contentSafeAreaChanged', pushInset);
        tg.onEvent('fullscreenChanged', pushInset);
        tg.onEvent('viewportChanged', pushInset);
        pushInset();
      } catch (e) { }
    }
    // не даём странице прокручиваться и масштабироваться жестами
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    var canvas = document.querySelector('#unity-canvas');
    var buildUrl = 'Build';
    var config = {
      arguments: [],
      dataUrl: buildUrl + '/a23c23941cbcc91f8f68ec97287e8c69.data.unityweb',
      frameworkUrl: buildUrl + '/36d2ddf56c3bcebbdc4b8144209dd666.framework.js.unityweb',
      codeUrl: buildUrl + '/ab1c501ebf6de1b5f0ace8089fac2b67.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Bulat",
      productName: "Jelly Merge",
      productVersion: "1.0",
      matchWebGLCanvasToWindow: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)   // чёткость без перегрева телефона
    };

    // экран загрузки показываем минимум MIN_SPLASH мс: полоска идёт плавно,
    // даже если игра загрузилась мгновенно (быстрый интернет / кэш)
    var MIN_SPLASH = 2500;
    var t0 = performance.now();
    var realProgress = 0, loaded = false;
    var fill = document.getElementById('fill');
    function tick() {
      var timeProgress = Math.min(1, (performance.now() - t0) / MIN_SPLASH);
      var shown = Math.min(realProgress, timeProgress);
      fill.style.width = Math.round(shown * 100) + '%';
      if (loaded && timeProgress >= 1) { hideSplash(); return; }
      requestAnimationFrame(tick);
    }
    function hideSplash() {
      fill.style.width = '100%';
      var l = document.getElementById('loader');
      setTimeout(function () { l.style.opacity = 0; }, 200);
      setTimeout(function () { l.remove(); }, 750);
    }
    requestAnimationFrame(tick);

    var script = document.createElement('script');
    script.src = buildUrl + '/7a53a2f605a25a0385e39baee03b8208.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        realProgress = p;
      }).then(function (instance) {
        unityInst = instance;
        pushInset();
        setTimeout(pushInset, 300);
        setTimeout(pushInset, 1200);
        realProgress = 1;
        loaded = true;
      }).catch(function (message) { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
