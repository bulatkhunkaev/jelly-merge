<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jelly Merge</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0b0c14; outline: none; }
    /* экран загрузки: баннер Jelly Pop на весь экран (cover), под логотипом — индикатор */
    #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #000; transition: opacity .5s; z-index: 10; }
    #splash { position: relative; flex: none; aspect-ratio: 941 / 1672;
      width: max(100vw, calc(100vh * 941 / 1672)); height: auto;
      background: url('TemplateData/splash3.jpg') center / 100% 100% no-repeat; }
    #bar { position: absolute; left: 50%; transform: translateX(-50%); top: 36.6%;
      width: min(46%, 82vw); height: 12px; padding: 4px; box-sizing: content-box;
      border-radius: 99px; background: rgba(10, 6, 24, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 0 16px rgba(0,0,0,.5); }
    #fill { height: 100%; width: 0; border-radius: 99px; transition: width .25s;
      background: linear-gradient(90deg, #ff2d8e, #ff8a12, #ffcc14, #44e01c, #1e6eff, #a83aff);
      box-shadow: 0 0 10px rgba(255,120,200,.7); }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><div id="splash"><div id="bar"><div id="fill"></div></div></div></div>
  <script>
    // --- Telegram Mini App: на весь экран, без закрытия свайпом, цвет шапки под фон
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        if (tg.setHeaderColor) tg.setHeaderColor('#0b0c14');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#0b0c14');
        if (tg.setBottomBarColor) tg.setBottomBarColor('#0b0c14');
      } catch (e) { }
    }
    // не даём странице прокручиваться и масштабироваться жестами
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    var canvas = document.querySelector('#unity-canvas');
    var buildUrl = 'Build';
    var config = {
      arguments: [],
      dataUrl: buildUrl + '/Telegram.data.unityweb',
      frameworkUrl: buildUrl + '/Telegram.framework.js.unityweb',
      codeUrl: buildUrl + '/Telegram.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Bulat",
      productName: "Jelly Merge",
      productVersion: "1.0",
      matchWebGLCanvasToWindow: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)   // чёткость без перегрева телефона
    };

    var script = document.createElement('script');
    script.src = buildUrl + '/Telegram.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById('fill').style.width = Math.round(p * 100) + '%';
      }).then(function () {
        var l = document.getElementById('loader');
        document.getElementById('fill').style.width = '100%';
        setTimeout(function () { l.style.opacity = 0; }, 250);
        setTimeout(function () { l.remove(); }, 800);
      }).catch(function (message) { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
