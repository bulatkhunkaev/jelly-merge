<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jelly Merge</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="TemplateData/story.js"></script>
  <script>
    // Звук игры играет напрямую через Web Audio (JellyWebAudio.jslib).
    // Просим iPhone играть его как игру ('ambient': уважает беззвучный режим).
    try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
    // ссылка на игру для кнопки «Поделиться»
    window.JM_GAME_LINK = 'https://t.me/JellyPops_bot?startapp';
    // таблица рекордов (Supabase Edge Function)
    window.JM_LB_URL = 'https://iewmmjmqfvnuvcufbnst.supabase.co/functions/v1/hyper-handler';
    // аналитика: событие (open / ready / game) — в ту же серверную функцию, таблица events
    window.JM_Track = function (kind, extra) {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        var initData = (tg && tg.initData) || '';
        if (!initData || !window.JM_LB_URL) return;      // вне Telegram не считаем
        var body = { initData: initData, track: kind, platform: tg.platform || '' };
        if (extra) for (var k in extra) body[k] = extra[k];
        fetch(window.JM_LB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body), keepalive: true }).catch(function () {});
      } catch (e) {}
    };
    window.JM_Track('open');
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0b0c14; outline: none; }
    /* экран загрузки: баннер Jelly Pop на весь экран (cover), под логотипом — индикатор */
    #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #000; transition: opacity .5s; z-index: 10;
      padding-top: var(--tg-top, 0px); box-sizing: border-box; }   /* не заезжаем под кнопки Telegram */
    #splash { position: relative; flex: none; aspect-ratio: 941 / 1672;
      width: max(100vw, calc((100vh - var(--tg-top, 0px)) * 941 / 1672)); height: auto;
      background: url('TemplateData/splash3.jpg') center / 100% 100% no-repeat; }
    #bar { position: absolute; left: 50%; transform: translateX(-50%); top: 36.6%;
      width: min(46%, 82vw); height: 12px; padding: 4px; box-sizing: content-box;
      border-radius: 99px; background: rgba(10, 6, 24, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 0 16px rgba(0,0,0,.5); }
    /* полоска: мягкие цветные пятна плывут внутри (как у радужной желешки);
       прогресс — обрезка clip-path, чтобы пятна не сжимались вместе с полоской */
    #fw { height: 100%; filter: drop-shadow(0 0 6px rgba(255,110,200,.75)); }
    #fill { height: 100%; width: 100%; border-radius: 99px;
      -webkit-clip-path: inset(0 100% 0 0 round 99px); clip-path: inset(0 100% 0 0 round 99px);
      transition: clip-path .12s linear, -webkit-clip-path .12s linear;
      background-color: #ff2d8e;
      background-image:
        radial-gradient(ellipse 34px 16px at 50% 50%, #12d6ff, rgba(18,214,255,0) 100%),
        radial-gradient(ellipse 30px 14px at 50% 40%, #a83aff, rgba(168,58,255,0) 100%),
        radial-gradient(ellipse 32px 15px at 50% 60%, #ffcc14, rgba(255,204,20,0) 100%),
        radial-gradient(ellipse 36px 16px at 50% 50%, #ff8a12, rgba(255,138,18,0) 100%);
      background-size: 150px 100%, 210px 100%, 180px 100%, 250px 100%;
      background-repeat: repeat-x;
      animation: jm-flow 6s linear infinite; }
    @keyframes jm-flow {
      from { background-position: 0 0, 40px 0, 90px 0, 20px 0; }
      to   { background-position: 150px 0, -170px 0, 270px 0, -230px 0; }
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><div id="splash"><div id="bar"><div id="fw"><div id="fill"></div></div></div></div></div>
  <script>
    // --- Telegram Mini App: на телефоне — полноэкранный режим (без шапки, кнопки Telegram поверх игры),
    //     без закрытия свайпом; игра получает высоту зоны кнопок и опускает интерфейс под них
    var tg = window.Telegram && window.Telegram.WebApp;
    var unityInst = null;
    function topInsetCss() {
      if (!tg) return 0;
      var a = tg.safeAreaInset || {}, c = tg.contentSafeAreaInset || {};
      return (a.top || 0) + (c.top || 0);
    }
    function pushInset() {
      document.documentElement.style.setProperty('--tg-top', topInsetCss() + 'px');
      if (!unityInst) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      try { unityInst.SendMessage('JellyGame', 'SetTopInset', String(topInsetCss() * dpr)); } catch (e) { }
    }
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        var mobile = ['ios', 'android', 'android_x'].indexOf(tg.platform) >= 0;
        if (mobile && tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) tg.requestFullscreen();
        if (tg.lockOrientation && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) tg.lockOrientation();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        if (tg.setBottomBarColor) tg.setBottomBarColor('#000000');
        tg.onEvent('safeAreaChanged', pushInset);
        tg.onEvent('contentSafeAreaChanged', pushInset);
        tg.onEvent('fullscreenChanged', pushInset);
        tg.onEvent('viewportChanged', pushInset);
        pushInset();
      } catch (e) { }
    }
    // не даём странице прокручиваться и масштабироваться жестами
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    var canvas = document.querySelector('#unity-canvas');
    var buildUrl = 'Build';
    var config = {
      arguments: [],
      dataUrl: buildUrl + '/639509c5b34a6805d8699b293c52072f.data.unityweb',
      frameworkUrl: buildUrl + '/3697c36a81b5f1d169e57614a46c9231.framework.js.unityweb',
      codeUrl: buildUrl + '/3d6ab6b2d22f516a6841860e6d115550.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Bulat",
      productName: "Jelly Merge",
      productVersion: "1.0",
      matchWebGLCanvasToWindow: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)   // чёткость без перегрева телефона
    };

    // экран загрузки показываем минимум MIN_SPLASH мс: полоска идёт плавно,
    // даже если игра загрузилась мгновенно (быстрый интернет / кэш)
    var MIN_SPLASH = 2500;
    var t0 = performance.now();
    var realProgress = 0, loaded = false;
    var fill = document.getElementById('fill');
    function setFill(v) {
      var c = 'inset(0 ' + (100 - Math.round(v * 100)) + '% 0 0 round 99px)';
      fill.style.webkitClipPath = c; fill.style.clipPath = c;
    }
    function tick() {
      var timeProgress = Math.min(1, (performance.now() - t0) / MIN_SPLASH);
      var shown = Math.min(realProgress, timeProgress);
      setFill(shown);
      if (loaded && timeProgress >= 1) { hideSplash(); return; }
      requestAnimationFrame(tick);
    }
    function hideSplash() {
      setFill(1);
      var l = document.getElementById('loader');
      setTimeout(function () { l.style.opacity = 0; }, 200);
      setTimeout(function () { l.remove(); }, 750);
    }
    requestAnimationFrame(tick);

    var script = document.createElement('script');
    script.src = buildUrl + '/5decfcc5850b4bacb82f639361a44579.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        realProgress = p;
      }).then(function (instance) {
        unityInst = instance;
        pushInset();
        setTimeout(pushInset, 300);
        setTimeout(pushInset, 1200);
        realProgress = 1;
        loaded = true;
      }).catch(function (message) { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
